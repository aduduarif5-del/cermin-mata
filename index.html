<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cermin Mata AR Try-On</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Enjin Face Detection Ringan -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  <style>
    .mirror-flip {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen py-6 px-4">
  <div class="max-w-4xl mx-auto">
    
    <header class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-blue-400">👓 Cermin Mata AR & Rekod Preskripsi</h1>
      <p class="text-slate-400 text-xs mt-1">Pandang skrin, pilih bingkai di bawah, dan simpan rekod.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
      
      <!-- Cermin AR -->
      <div class="md:col-span-7 flex flex-col items-center">
        <div class="w-full bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl">
          
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span> Kamera Aktif
            </span>
            <span id="statusTxt" class="text-[11px] bg-slate-800 text-amber-300 px-3 py-1 rounded-full">
              Menghidupkan Pengesan Wajah...
            </span>
          </div>

          <!-- Video & Canvas Penindih -->
          <div class="relative w-full aspect-[4/3] bg-black rounded-2xl overflow-hidden flex items-center justify-center">
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover mirror-flip"></video>
            <canvas id="arCanvas" class="absolute inset-0 w-full h-full object-cover mirror-flip pointer-events-none"></canvas>
          </div>

          <!-- Butang Tukar Cermin Mata -->
          <div class="mt-4">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Pilih Bingkai:</span>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="pilihFrame('aviator')" id="btn-aviator" class="border-2 border-blue-500 bg-blue-600/30 p-2.5 rounded-xl text-xs font-bold transition">
                Aviator Gold
              </button>
              <button type="button" onclick="pilihFrame('round')" id="btn-round" class="border border-slate-700 bg-slate-800 p-2.5 rounded-xl text-xs font-bold transition">
                Classic Round
              </button>
              <button type="button" onclick="pilihFrame('square')" id="btn-square" class="border border-slate-700 bg-slate-800 p-2.5 rounded-xl text-xs font-bold transition">
                Square Black
              </button>
            </div>
          </div>

          <!-- Ambil Gambar -->
          <button type="button" onclick="ambilFoto()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-camera"></i> Tangkap Gambar Bersama Cermin Mata
          </button>

          <!-- Snapshot Preview -->
          <div id="previewCard" class="hidden mt-3 p-2 bg-slate-800 rounded-xl flex items-center gap-3 border border-emerald-500/50">
            <img id="imgSnapshot" class="w-14 h-14 object-cover rounded-lg" alt="Snapshot" />
            <div class="text-xs text-emerald-400 font-semibold">
              Foto berjaya diambil! Sedia untuk dihantar ke Google Sheet.
            </div>
          </div>

        </div>
      </div>

      <!-- Borang Google Sheet -->
      <div class="md:col-span-5">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
          <h2 class="text-base font-bold text-white border-b border-slate-800 pb-2 mb-4">
            Maklumat Pesakit & Power Mata
          </h2>

          <div id="msgBox" class="hidden mb-3 p-3 rounded-xl text-xs font-semibold"></div>

          <form id="optomForm" onsubmit="hantarGoogleSheet(event)" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Nama Penuh *</label>
              <input type="text" name="nama" required placeholder="Ali Bin Abu" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">No. Telefon *</label>
              <input type="tel" name="telefon" required placeholder="0123456789" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
            </div>

            <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs space-y-2">
              <span class="text-blue-400 font-bold block">Power Mata:</span>
              <div class="grid grid-cols-2 gap-2">
                <input type="text" name="sphR" placeholder="SPH Kanan (-2.00)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center" />
                <input type="text" name="sphL" placeholder="SPH Kiri (-2.25)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center" />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <input type="text" name="cylR" placeholder="CYL Kanan (-0.50)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center" />
                <input type="text" name="cylL" placeholder="CYL Kiri (-0.75)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-center" />
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Bingkai Pilihan</label>
              <input type="text" id="inputBingkai" name="jenisBingkai" readonly value="Aviator Gold" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-emerald-400 font-bold" />
            </div>

            <button type="submit" id="btnHantar" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-sm transition mt-3">
              Simpan ke Google Sheet
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwddy629DX28gP_3k5V11wcg_qmJ48cJrgaf7WczZ8TEjbmzXjIfWpXzbsdWgkeEZ8e/exec";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('arCanvas');
    const ctx = canvas.getContext('2d');
    const statusTxt = document.getElementById('statusTxt');

    let detector = null;
    let selectedFrame = 'aviator';
    let snapBase64 = null;

    // Grafik Cermin Mata
    const svgs = {
      aviator: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
        <path d="M 210,85 Q 250,70 290,85" stroke="#eab308" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M 215,102 Q 250,92 285,102" stroke="#eab308" stroke-width="5" fill="none"/>
        <path d="M 75,80 C 85,35 195,35 205,80 C 210,130 180,180 135,180 C 90,180 70,130 75,80 Z" fill="rgba(15,23,42,0.4)" stroke="#eab308" stroke-width="10"/>
        <path d="M 425,80 C 415,35 305,35 295,80 C 290,130 320,180 365,180 C 410,180 430,130 425,80 Z" fill="rgba(15,23,42,0.4)" stroke="#eab308" stroke-width="10"/>
        <path d="M 75,80 L 25,75" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
        <path d="M 425,80 L 475,75" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
      </svg>`,
      round: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
        <path d="M 210,95 Q 250,80 290,95" stroke="#38bdf8" stroke-width="9" fill="none" stroke-linecap="round"/>
        <circle cx="140" cy="100" r="65" fill="rgba(56,189,248,0.2)" stroke="#0f172a" stroke-width="14"/>
        <circle cx="360" cy="100" r="65" fill="rgba(56,189,248,0.2)" stroke="#0f172a" stroke-width="14"/>
        <path d="M 75,100 L 25,95" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
        <path d="M 425,100 L 475,95" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
      </svg>`,
      square: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
        <path d="M 215,90 L 285,90" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
        <rect x="75" y="50" width="140" height="95" rx="18" fill="rgba(15,23,42,0.45)" stroke="#020617" stroke-width="16"/>
        <rect x="285" y="50" width="140" height="95" rx="18" fill="rgba(15,23,42,0.45)" stroke="#020617" stroke-width="16"/>
        <path d="M 75,65 L 25,60" stroke="#020617" stroke-width="12" stroke-linecap="round"/>
        <path d="M 425,65 L 475,60" stroke="#020617" stroke-width="12" stroke-linecap="round"/>
      </svg>`
    };

    const frameImages = {};
    for (const [k, v] of Object.entries(svgs)) {
      const img = new Image();
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(v);
      frameImages[k] = img;
    }

    function pilihFrame(type) {
      selectedFrame = type;
      ['aviator', 'round', 'square'].forEach(id => {
        const b = document.getElementById('btn-' + id);
        b.className = (id === type) 
          ? "border-2 border-blue-500 bg-blue-600/30 p-2.5 rounded-xl text-xs font-bold transition"
          : "border border-slate-700 bg-slate-800 p-2.5 rounded-xl text-xs font-bold transition";
      });
      const names = { aviator: "Aviator Gold", round: "Classic Round", square: "Square Black" };
      document.getElementById('inputBingkai').value = names[type];
    }

    // 1. Mulakan Kamera Natif
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(res => video.onloadedmetadata = res);
        video.play();
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusTxt.textContent = "Kamera Aktif. Mengimbas Muka...";
        loadModel();
      } catch (err) {
        statusTxt.textContent = "Kamera Disekat!";
        alert("Sila benarkan akses kamera pelayar: " + err.message);
      }
    }

    // 2. Muat Enjin Pengesan Wajah
    async function loadModel() {
      try {
        const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
        const detectorConfig = {
          runtime: 'tfjs',
          refineLandmarks: false
        };
        detector = await faceLandmarksDetection.createDetector(model, detectorConfig);
        statusTxt.textContent = "AR Sedia Digunakan!";
        statusTxt.className = "text-[11px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-3 py-1 rounded-full";
        renderLoop();
      } catch (e) {
        statusTxt.textContent = "Ralat AR: " + e.message;
      }
    }

    // 3. Render Loop Cermin Mata
    async function renderLoop() {
      if (detector && video.readyState >= 2) {
        try {
          const faces = await detector.estimateFaces(video, { flipHorizontal: false });
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (faces.length > 0) {
            const keypoints = faces[0].keypoints;
            
            // Mata Kiri luaran (33), Mata Kanan luaran (263), Batang Hidung (168)
            const leftEye = keypoints[33] || keypoints[130];
            const rightEye = keypoints[263] || keypoints[359];
            const nose = keypoints[168] || keypoints[6];

            if (leftEye && rightEye && nose) {
              const dx = rightEye.x - leftEye.x;
              const dy = rightEye.y - leftEye.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              const angle = Math.atan2(dy, dx);

              const frameWidth = distance * 2.15;
              const frameHeight = frameWidth * 0.4;

              ctx.save();
              ctx.translate(nose.x, nose.y + 5);
              ctx.rotate(angle);

              const img = frameImages[selectedFrame];
              if (img && img.complete) {
                ctx.drawImage(img, -frameWidth / 2, -frameHeight / 2, frameWidth, frameHeight);
              }
              ctx.restore();
            }
          }
        } catch (err) {}
      }
      requestAnimationFrame(renderLoop);
    }

    // 4. Tangkap Gambar
    function ambilFoto() {
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = canvas.width;
      snapCanvas.height = canvas.height;
      const sCtx = snapCanvas.getContext('2d');

      // Lukis video dan cermin mata serentak
      sCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
      sCtx.drawImage(canvas, 0, 0, snapCanvas.width, snapCanvas.height);

      snapBase64 = snapCanvas.toDataURL('image/png', 0.85);
      document.getElementById('imgSnapshot').src = snapBase64;
      document.getElementById('previewCard').classList.remove('hidden');
    }

    // 5. Hantar ke Google Apps Script
    function hantarGoogleSheet(e) {
      e.preventDefault();
      const form = document.getElementById('optomForm');
      const btn = document.getElementById('btnHantar');
      const msgBox = document.getElementById('msgBox');

      btn.disabled = true;
      btn.textContent = "Menyimpan ke Google Sheet...";
      msgBox.className = "hidden";

      const payload = {
        nama: form.nama.value,
        telefon: form.telefon.value,
        tarikhPeriksa: new Date().toISOString().split('T')[0],
        sphR: form.sphR.value,
        sphL: form.sphL.value,
        cylR: form.cylR.value,
        cylL: form.cylL.value,
        axisR: "0",
        axisL: "0",
        addPower: "-",
        jenisKanta: "Standard",
        jenisBingkai: form.jenisBingkai.value,
        catatanKesihatan: "-",
        snapshotBase64: snapBase64
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.disabled = false;
        btn.textContent = "Simpan ke Google Sheet";
        msgBox.className = "mb-3 p-3 rounded-xl text-xs font-semibold bg-emerald-950 text-emerald-300 border border-emerald-800";
        msgBox.textContent = "Rekod dan foto berjaya disimpan ke Google Sheet!";
        form.reset();
        document.getElementById('previewCard').classList.add('hidden');
        snapBase64 = null;
      })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = "Simpan ke Google Sheet";
        msgBox.className = "mb-3 p-3 rounded-xl text-xs font-semibold bg-rose-950 text-rose-300 border border-rose-800";
        msgBox.textContent = "Ralat: " + err.message;
      });
    }

    window.onload = startCamera;
  </script>
</body>
</html>
